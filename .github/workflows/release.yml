name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.3.0 (tag v<version> is created/moved onto the branch head)'
        required: true
        default: '1.0.0'

# Required so the workflow can create the GitHub Release.
permissions:
  contents: write

jobs:
  # 说明、tag、产物三者一致性的关键：workflow_dispatch 进来时先把 v<version>
  # tag 建好/挪到本次 commit（force），再构建发布 —— softprops 创建 release 时
  # 挂到的就是刚就位的 tag。tag-push 进来时 tag 天然就位，这一步跳过。
  #
  # 为什么不能拆成"先挪 tag 的 job + 等它触发的构建 job"：用 GITHUB_TOKEN 推的
  # ref 不会触发新的 workflow run（GitHub 的防循环机制）—— tag 推上去了，
  # 下游构建 job 永远不会启动（v1.3.1 第一次 dispatch 实锤：tag 推上去了，
  # build run 从未出现）。挪 tag 和构建必须在同一个 run 里顺序完成。
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create or move tag onto this commit (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $tag = "v$('${{ github.event.inputs.version }}'.Trim())"
          # -f：同名 tag 已存在时必须挪过来，而不是报错后悄悄把 release 挂到旧位置
          git tag -f $tag ${{ github.sha }}
          git push origin $tag --force
          Write-Host "Tag $tag points at ${{ github.sha }}"

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install NSIS
        shell: pwsh
        run: |
          # NSIS provides makensis.exe, used by publish.ps1 to build dist\Setup.exe.
          choco install nsis -y
          # Make makensis reachable on PATH for subsequent steps / publish.ps1.
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          # dispatch：以手动输入为准；tag push：以 tag 名为准（唯一事实来源）。
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $v = '${{ github.event.inputs.version }}'
          } else {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          }
          $v = $v.Trim()
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "Building release version: $v"

      - name: Patch version into TaskScheduler.nsi
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'.Trim()
          # NSIS requires VIProductVersion / FileVersion to be a FOUR-part
          # "X.X.X.X" string. A tag like "v1.0" would otherwise produce
          # "1.0.0" (three parts) and makensis aborts the build. Normalize
          # defensively: take the numeric parts and pad up to four.
          $parts = ($v -split '[.\-+]') | Where-Object { $_ -match '^\d+$' }
          while ($parts.Count -lt 4) { $parts += '0' }
          $v4 = ($parts[0..3] -join '.')
          $file = 'TaskScheduler.nsi'
          $content = Get-Content $file -Raw -Encoding UTF8
          $content = $content -replace '!define TS_VERSION\s+"[^"]+"', "!define TS_VERSION `"$v`""
          # Override the version-info lines directly with the four-part value so
          # the build never depends on the "${TS_VERSION}.0" string concatenation.
          $content = $content -replace 'VIProductVersion\s+"[^"]+"', "VIProductVersion `"$v4`""
          $content = $content -replace 'VIAddVersionKey\s+/LANG=2052\s+"FileVersion"\s+"[^"]+"', "VIAddVersionKey /LANG=2052 `"FileVersion`" `"$v4`""
          # Keep the UTF-8 BOM: the .nsi contains Chinese comments, and makensis
          # misreads a BOM-less UTF-8 file as ANSI on some setups.
          Set-Content $file -Value $content -Encoding utf8BOM
          Write-Host "TS_VERSION -> $v ; VIProductVersion/FileVersion -> $v4"

      - name: Publish app and build installer
        shell: pwsh
        run: ./publish.ps1
        # publish.ps1 performs: contract checks, dotnet publish -> dist/, makensis -> dist\Setup.exe

      - name: Prepare release assets
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $dist = 'dist'
          if (-not (Test-Path "$dist\Setup.exe")) {
            throw "Setup.exe was not produced by the installer build"
          }
          # Installer, renamed to a versioned, recognizable name.
          Move-Item "$dist\Setup.exe" "TaskScheduler-$v-setup.exe"
          # Portable package: the published app files (no installer).
          Compress-Archive -Path "$dist\*" -DestinationPath "TaskScheduler-$v-portable.zip" -Force

      - name: Generate categorized release notes
        id: notes
        shell: pwsh
        run: |
          $ver = '${{ steps.ver.outputs.version }}'.Trim()

          # 把 tag 解析成 [version]。注意：pwsh 下 [version]::TryParse($x, [ref]$v) 的
          # 内联 [ref] 调用会触发方法重载解析失败（"argument count: 3"），故统一用
          # [version]::new(...) 构造，避免该坑。
          function New-Version([string]$tag) {
            $s = $tag -replace '^v', ''
            $parts = @($s -split '[.\-+]' | Where-Object { $_ -match '^\d+$' })
            if ($parts.Count -eq 0) { throw "not a version tag: $tag" }
            while ($parts.Count -lt 4) { $parts += '0' }
            return [version]::new([int]$parts[0], [int]$parts[1], [int]$parts[2], [int]$parts[3])
          }

          # 当前版本号（解析失败则视为极大值，所有历史 tag 都算"上一个"）
          $curVer = $null
          try { $curVer = New-Version "v$ver" } catch { $curVer = [version]::new(9999, 0) }

          # 找上一个版本 tag：版本号严格小于当前的最高 tag
          $prev = $null
          $bestVer = $null
          foreach ($t in (git tag --list 'v*')) {
            try { $v = New-Version $t } catch { continue }
            if ($v -lt $curVer) {
              if ($bestVer -eq $null -or $v -gt $bestVer) { $prev = $t; $bestVer = $v }
            }
          }
          # 取上一个 tag 到当前 HEAD 之间的全部提交；首个版本则取全部历史
          $range = if ($prev) { "$prev..HEAD" } else { "HEAD" }
          Write-Host "Notes range: $range (prev=$prev)"

          # Guard: a tag that points at the same commit as the previous release
          # produces an EMPTY range -> an empty "what's new" body, and GitHub's
          # auto-notes then walk PAST the same-commit tag for the compare link
          # (Full Changelog jumped straight back to an older version once).
          # Fail loudly instead: repoint/delete the tag and push real commits.
          if ($prev -and -not @(git log "$prev..HEAD" --oneline)) {
            throw ("No commits between $prev and HEAD: this tag adds no changes. " +
                   "Delete/repoint the tag and push real commits before releasing.")
          }

          $feat  = [System.Collections.Generic.List[string]]::new()
          $fix   = [System.Collections.Generic.List[string]]::new()
          $other = [System.Collections.Generic.List[string]]::new()

          # 解析每条提交主题的首行：形如 "feat: xxx" / "fix: xxx" → 按前缀分类
          foreach ($line in (git log $range --pretty=format:"%s")) {
            $line = $line.Trim()
            if ($line -match '^(?<type>[a-zA-Z]+):\s*(?<desc>.*)$') {
              $type = $matches['type'].ToLower()
              $desc = $matches['desc'].Trim()
              if ($desc -eq '') { $desc = $line }
              switch ($type) {
                { $_ -in 'feat','feature' }            { $feat.Add($desc) }
                { $_ -in 'fix','bugfix','bug','hotfix' } { $fix.Add($desc) }
                default                                { $other.Add("$type`: $desc") }
              }
            } elseif ($line -ne '') {
              $other.Add($line)
            }
          }

          $sb = [System.Text.StringBuilder]::new()
          [void]$sb.AppendLine("# 更新说明 v$ver")
          [void]$sb.AppendLine('')
          if ($feat.Count -gt 0) {
            [void]$sb.AppendLine('## 新功能')
            foreach ($f in $feat) { [void]$sb.AppendLine("- $f") }
            [void]$sb.AppendLine('')
          }
          if ($fix.Count -gt 0) {
            [void]$sb.AppendLine('## 问题修复')
            foreach ($f in $fix) { [void]$sb.AppendLine("- $f") }
            [void]$sb.AppendLine('')
          }
          if ($other.Count -gt 0) {
            [void]$sb.AppendLine('## 其它')
            foreach ($o in $other) { [void]$sb.AppendLine("- $o") }
            [void]$sb.AppendLine('')
          }
          [void]$sb.AppendLine('_由 CI 依据提交历史自动生成（按 feat / fix 等前缀分类）_')

          Set-Content -Path release_notes.md -Value $sb.ToString() -Encoding utf8
          Write-Host "Release notes generated: feat=$($feat.Count) fix=$($fix.Count) other=$($other.Count)"

      # 机器可读的版本清单：除了 GitHub API，客户端也支持直接读这份 JSON。
      # 国内用户可把 update.json（以及 setup.exe）同步到 Gitee / 自建站点 / 对象存储，
      # 然后在「设置 → 更新 → 版本清单地址」里填那个国内地址，彻底绕开 GitHub。
      - name: Generate update manifest
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'.Trim()
          $repo = '${{ github.repository }}'
          $notes = if (Test-Path release_notes.md) { Get-Content release_notes.md -Raw -Encoding utf8 } else { '' }
          $manifest = [ordered]@{
            version     = $v
            title       = "v$v"
            notes       = $notes
            url         = "https://github.com/$repo/releases/download/v$v/TaskScheduler-$v-setup.exe"
            pageUrl     = "https://github.com/$repo/releases/tag/v$v"
            fileName    = "TaskScheduler-$v-setup.exe"
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content update.json -Encoding utf8
          Write-Host "update.json generated for v$v"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          body_path: release_notes.md
          # GitHub 原生自动说明（What's Changed + 完整提交列表 + 新贡献者）会追加在 body_path 内容之后，
          # 与上面按 feat/fix 分类的手写说明互补，两边都不缺
          generate_release_notes: true
          files: |
            TaskScheduler-${{ steps.ver.outputs.version }}-setup.exe
            TaskScheduler-${{ steps.ver.outputs.version }}-portable.zip
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 把产物同步到 Gitee 制品仓库。该仓库是「所有项目共用」的 dist 库，按项目分目录：
      # 这里只读写 TaskScheduler/ 子目录，其它项目的文件一个都不碰。
      # 客户端默认读固定地址 <repo>/raw/master/TaskScheduler/update.json，
      # 因此不用仓库级 releases/latest（那会串到别的项目最新发的 Release）。
      #
      # 需要在 GitHub 仓库 Settings → Secrets and variables → Actions 里配置
      # GITEE_TOKEN（Gitee 私人令牌，projects 写权限）。没配就整步跳过，
      # GitHub Release 照常发布，客户端会自动回退到 GitHub + 加速节点。
      # 可用仓库变量 GITEE_DIST_REPO / GITEE_DIST_DIR 覆盖默认仓库与子目录。
      - name: Sync artifacts to Gitee dist repo
        shell: pwsh
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ vars.GITEE_DIST_REPO || 'yann9/dist' }}
          GITEE_DIR: ${{ vars.GITEE_DIST_DIR || 'TaskScheduler' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GITEE_TOKEN) {
            Write-Host 'GITEE_TOKEN not configured - skipping Gitee sync (GitHub release is unaffected).'
            exit 0
          }

          $repo = $env:GITEE_REPO
          $dir = $env:GITEE_DIR
          $v = '${{ steps.ver.outputs.version }}'.Trim()
          $root = (Get-Location).Path
          $ghRepo = '${{ github.repository }}'
          $setup = "TaskScheduler-$v-setup.exe"
          $portable = "TaskScheduler-$v-portable.zip"

          # 主地址走 Gitee raw（国内直连），备用地址指向 GitHub Release。
          # Gitee raw 对较大的 .exe 可能返回 403，客户端遇到失败会自动换用备用地址，
          # 并自动套上加速节点，升级链路不会因此断掉。
          $notes = if (Test-Path release_notes.md) { Get-Content release_notes.md -Raw -Encoding utf8 } else { '' }
          $manifest = [ordered]@{
            version     = $v
            title       = "v$v"
            notes       = $notes
            url         = "https://gitee.com/$repo/raw/master/$dir/TaskScheduler-setup.exe"
            fallbackUrl = "https://github.com/$ghRepo/releases/download/v$v/$setup"
            pageUrl     = "https://gitee.com/$repo/tree/master/$dir"
            fileName    = $setup
            publishedAt = (Get-Date).ToUniversalTime().ToString('o')
          }
          $json = $manifest | ConvertTo-Json -Depth 5

          # 令牌经 http.extraheader 注入：不拼进 remote URL，日志里也不会出现。
          $owner = $repo.Split('/')[0]
          $basic = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$owner`:$($env:GITEE_TOKEN)"))
          $gitCfg = "http.https://gitee.com/.extraheader=AUTHORIZATION: basic $basic"

          $work = Join-Path $env:RUNNER_TEMP 'gitee-dist-sync'
          if (Test-Path $work) { Remove-Item $work -Recurse -Force }
          git -c $gitCfg clone --depth 1 --branch master "https://gitee.com/$repo.git" $work
          if ($LASTEXITCODE -ne 0) { throw 'git clone failed' }

          Push-Location $work
          try {
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            # 制品仓库可能仍是空白 master（连一个 commit 都没有），显式把 HEAD 指过去。
            git symbolic-ref HEAD refs/heads/master

            $target = Join-Path (Get-Location).Path $dir
            New-Item -ItemType Directory -Path $target -Force | Out-Null
            Set-Content -Path (Join-Path $target 'update.json') -Value $json -Encoding utf8
            Copy-Item (Join-Path $root $setup) (Join-Path $target 'TaskScheduler-setup.exe') -Force
            Copy-Item (Join-Path $root $portable) (Join-Path $target 'TaskScheduler-portable.zip') -Force

            # 只暂存本项目目录：共用仓库里其它项目的文件不受影响。
            git add -- "$dir"
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "chore: publish TaskScheduler v$v"
              git -c $gitCfg push origin HEAD:master
              if ($LASTEXITCODE -ne 0) { throw 'git push failed' }
              Write-Host "Synced to https://gitee.com/$repo/tree/master/$dir"
            } else {
              Write-Host 'No changes - Gitee artifacts are already up to date.'
            }
          } finally {
            Pop-Location
          }
